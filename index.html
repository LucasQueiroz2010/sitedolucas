	<h2 class="Borda line branco backgroundblack">Página principal</h2>
	<br>
	<div class="borda-texto">
	<p class="text-secondary" id="saudações"></p>
	<p class="text-secondary" id="Idade"></p>
	<div class="Versão_do_Site">Versão: 1.9.10.1</div>	
	<p class="text-secondary" id="saudações2"></p>
	<p class="text-primary">Feedbacks sempre são bem vindos!</p>
	</div>

	<h2 id="sombraP">Sua opinião! (WIP)</h2>

	<form class="textnoselect branco borda-texto">

		<fieldset>
			<legend class="esquerda">Informações:</legend>

			<div class="form-group">
				<label for="nome" class="esquerda text-info">Nome:ﾠ</label><br>
				<input onfocus="console.log('Insira seu nome')" type="text" name="nome" id="nome" placeholder="Insira seu nome!" class="this nome form-control-lg centralizar" required autofocus>
			</div>
				<label for="Email" class="esquerda align text-info">Email:</label><br>
			<div class="input-group">			
				<input onfocus="console.log('Insira seu email')" class="form-control" type="text" placeholder="Insira seu email!" required>
				<div>
					<span class="input-group-text">@gmail.com</span>
				</div>
			</div>

			<div class="form-group">
				<label for="Senha" class="esquerda align text-info">Senha:</label>
				<input onfocus="console.log('Insira sua senha')" type="password" name="nome" id="Senha" placeholder="Insira sua senha!" class="this senha form-control centralizar" required>
			</div>

			<div class="form-group">
				<label for="data" class="esquerda text-info"><Data></Data>Que dia você nasceu?</label>
				<input onfocus="console.log('Insira sua data de nascimento')" type="date" name="Data" id="Data" placeholder="Que dia é hoje?!" class="this calendario form-control centralizar" required>
			</div>

			<div class="form-group text-info textnoselect branco centralizar">
				<label class="centralizar" for="arquivo">Envie uma foto linda!</label>
				<input class="form-control-file centralizar" type="file" id="arquivo" required>
			</div>
		</fieldset>

		<fieldset>
				<div>
					<span onfocus="console.log('Insira seu comentário')" class="text-info centralizar input-group-text">Comentários 💬</span>
				</div>
			<div class="input-group">
				<textarea class="form-control" id="Comentários" rows="4"></textarea>
			</div>
		</fieldset>

		<fieldset>
			<div class="form-group">
				<label for="Lembrar" class="text-info">Lembrar de mim?</label required>
				<select class="form-control centralizar" id="Lembrar" name="Lembrar">
					<option class="text-dark">Selecione...</option>
					<option class="text-success">Sim</option>
					<option class="text-danger">Não</option>
				</select>
			</div>
			<div class="text-info">Esse site é bem feito?</div>
			<div class="form-group">
				<label id="range">Satisfação de 0-10</label><br>
				<input class="text-info custom-range" type="range" min="1" max="11" required>
			</div>
		</fieldset>
		<input style="cursor: help;" class="submit BIGSHOT btn btn-lg" type="submit" value="Enviar" id="transicaolink">
	</form>
