<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Velha</title>
    <link rel="stylesheet" href="estilodavelha.css">
</head>
<body>

    <main class="jogo">
        <a class="linkgenerico" href="index.html">Página Principal.</a>

        <h1>Jogo da Velha genéricos</h1>

        <div id="turno">Jogador 1, começe.</div>

<div class="tabuleiro branco" id="tabuleiro" style="user-select: none;">
    <div class="celula" data-index="0"></div>
    <div class="celula" data-index="1"></div>
    <div class="celula" data-index="2"></div>
    <div class="celula" data-index="3"></div>
    <div class="celula" data-index="4"></div>
    <div class="celula" data-index="5"></div>
    <div class="celula" data-index="6"></div>
    <div class="celula" data-index="7"></div>
    <div class="celula" data-index="8"></div>
</div>

<!-- Botão do reset -->
<button onclick="resetarJogo()" id="resetBtn">
    <span id="textoReset">Resetar jogo.</span>
</button>
</div>

<!-- Música de fundo -->
<audio id="minhaMusica" loop>
    <source src="Soundtrack_JV/background_music.mp3">
    Seu navegador não suporta áudio.
</audio>

<div id="overlayMusica" class="teladeinicio">
    <div class="conteudo_teladeinicio">
        <h2>Clique para iniciar o Jogo da Velha!</h2>
    <button id="botaostart">Start.</button><br>
    <button class="linkgenerico2" onclick="window.location.href='index.html'">Página Principal</button>
    </div>
</div>
    </main>

<!-- Entrada do Java Script -->
    <script src="JavaScripts_gerais/script_jogodavelha.js"></script>
</body>
</html>
