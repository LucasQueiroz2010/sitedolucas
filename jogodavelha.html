<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo.css">
    <link rel="stylesheet" href="normalize.css">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <title>Jogo dos Loucos!</title>
    <style type="text/css">
        :root {
            --img-p1: url('');
            --img-p2: url('');
            --bg-setup: url('jogodavelha/background_config.png'); 
            --bg-game: url('jogodavelha/background_game.jpg');}
        body {
            background-image: var(--bg-setup);
            background-color: #222;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            transition: background-image 0.5s ease-in-out;}
        body.game-mode {
            background-image: var(--bg-game);}
        #game-container {
            flex-direction: column;
            align-items: center;
            width: 100%;}

        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 10px;
            margin-top: 20px;}
        .cell {
            width: 100px;
            height: 100px;
            background-color: rgba(68, 68, 68, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background-size: 80%;
            background-repeat: no-repeat;
            background-position: center;
            border: 2px solid #555;}
        .cell.p1 {
            background-image: var(--img-p1);}
        .cell.p2 {
            background-image: var(--img-p2);}
        #fullscreen-btn img {
            width: 30px;
            height: 30px;}

        .centralizar {
            text-align: center;
            margin: 5px;}

        .char-selection-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 15px 0;}
        .char-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 10px;}
        .char-btn {
            width: 80px;
            height: 80px;
            border: 2px solid white;
            background-color: #333;
            background-size: cover;
            background-position: center;
            cursor: pointer;
            transition: transform 0.2s;}
        .char-btn:hover {
            transform: scale(1.1);
            border-color: #ffcc00;}
        .char-label {
            margin-top: 5px;
            font-size: 0.9em;
            color: #fff;
            font-weight: bold;}
        h1 {
            text-shadow: 2px 2px 4px #000;}
    </style>
</head>

<body>
    <div class="centralizar" id="setup">
        <h1>Configuração do Jogo</h1>
        <a class="Bordalink branco Pizza_Game_Link" href="index.html">Site Principal</a><br>
        <input class="centralizar" type="text" id="p1Name" placeholder="Nome Jogador 1">
        <br>
        <input class="centralizar" type="text" id="p2Name" placeholder="Nome Jogador 2">
        <br>
        <input class="centralizar" type="number" id="rounds" placeholder="Nº de Partidas (Ímpar)" min="1" step="2">
        <br>
        <div class="char-selection-container">
            <div class="char-box">
                <span>Player 1</span>
                <button id="btn-p1-select" class="char-btn" onclick="cycleCharacter(1)"></button>
                <span id="label-p1" class="char-label">Escolha...</span>
            </div>
            <div class="char-box">
                <span>Player 2</span>
                <button id="btn-p2-select" class="char-btn" onclick="cycleCharacter(2)"></button>
                <span id="label-p2" class="char-label">Escolha...</span>
            </div>
        </div>
        <button class="centralizar" onclick="startGame()">Começar Jogo!</button>
    </div>
    <div id="game-container" style="display:none;">
        <div class="controls">
            <button id="fullscreen-btn" onclick="toggleFullscreen()">
                <img id="fs-icon" src="jogodavelha/fullscreen_on.png" alt="Fullscreen">
            </button>
            <button onclick="resetFullGame()">Resetar</button>
        </div>
        <h2 id="scoreboard">Aguarde...</h2>
        <div class="board" id="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>
    </div>
    <audio id="setupMusic" loop src="jogodavelha/Soundtrack/Inicial_music.mp3"></audio> <audio id="bgMusic" loop src="jogodavelha/Soundtrack/Background_music.mp3"></audio> <audio id="draw_sound" src="jogodavelha/Soundtrack/draw.wav"></audio>
    <audio id="p1_move_1"></audio>
    <audio id="p1_move_2"></audio>
    <audio id="p1_move_3"></audio>
    <audio id="p1_move_4"></audio>
    <audio id="p1_point"></audio>
    <audio id="p1_win_theme"></audio>
    <audio id="p2_move_1"></audio>
    <audio id="p2_move_2"></audio>
    <audio id="p2_move_3"></audio>
    <audio id="p2_move_4"></audio>
    <audio id="p2_point"></audio>
    <audio id="p2_win_theme"></audio>
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.3/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/js/bootstrap.min.js"></script>
    <script src="JavaScripts_gerais/script_geral.js"></script>
    <script src="JavaScripts_gerais/script_jogodavelha.js"></script>
</body>

</html>
