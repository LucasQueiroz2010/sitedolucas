<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTWE</title>
    <link rel="stylesheet" href="estilo.css">
    <style>
        body { margin: 0; }
        .auth-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        .auth-card {
            background: #1f1f1f;
            border: 3px solid #f7c948;
            border-radius: 12px;
            padding: 24px;
            width: min(420px, 100%);
            color: white;
            box-shadow: 0 0 20px rgba(0,0,0,0.6);
            text-align: center;
        }
        .auth-card input {
            width: 100%;
            margin-bottom: 12px;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #666;
            background: #111;
            color: white;
            box-sizing: border-box;
        }
        .auth-card button {
            width: 100%;
            margin-bottom: 10px;
        }
        .auth-link {
            color: #7fd3ff;
            cursor: pointer;
            text-decoration: underline;
            margin-top: 10px;
            display: inline-block;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="auth-screen" class="auth-overlay">
        <div class="auth-card">
            <h2 id="auth-title">PTWE LOGIN</h2>
            <p id="auth-message">Entre na sua conta exclusiva do PTWE para salvar progresso e perfil.</p>
            <input id="auth-username" type="text" placeholder="Nome de usuário">
            <input id="auth-password" type="password" placeholder="Senha">
            <button id="auth-submit" class="btn-start">ENTRAR</button>
            <button id="auth-toggle" class="btn-start" style="background:#2b8a3e; border-color:#1f6b2d;">CRIAR CONTA</button>
            <div class="auth-link" onclick="window.location.href='../index.html'">Voltar ao site principal</div>
        </div>
    </div>

    <div id="perfil-ptwe" onclick="abrirEstatisticas()">
        <img id="foto-perfil-ptwe" src="../imagens/usuario_padrao.png" alt="Perfil">
        <span id="nome-perfil-ptwe">Player</span>
    </div>

    <div id="stats-screen" style="display: none;">
        <h2>PLAYER STATUS</h2>
        <div id="stats-content" class="stats-box"></div>
        <div class="botoes-container">
            <button class="btn-start" style="font-size: 25px; padding: 10px 20px;" onclick="abrirEdicaoPerfil()">EDIT PROFILE</button>
            <button class="btn-start" style="font-size: 25px; padding: 10px 20px; background: #ff3333; border-color: #aa0000; color: white; text-shadow: 2px 2px 0px black; box-shadow: 0px 8px 0px #880000;" onclick="apagarDados()">ERASE DATA</button>
            <button class="btn-start" style="font-size: 25px; padding: 10px 20px;" onclick="deslogarPTWE(); window.location.href='../index.html'">LOGOUT</button>
            <button class="btn-start" style="font-size: 25px; padding: 10px 20px;" onclick="fecharEstatisticas()">BACK</button>
        </div>
    </div>

    <div id="edit-profile-screen" style="display: none;">
        <h2>EDIT PROFILE</h2>
        <div class="stats-box" style="display: flex; flex-direction: column; gap: 10px; align-items: center;">
            <input type="text" id="input-novo-nome" placeholder="Seu nome">
            <div id="grid-avatares" style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; max-height: 200px; overflow-y: auto; padding: 10px;"></div>
        </div>
        <div class="botoes-container">
            <button class="btn-start" style="font-size: 25px; padding: 10px 20px;" onclick="salvarEdicaoPerfil()">SAVE</button>
            <button class="btn-start" style="font-size: 25px; padding: 10px 20px;" onclick="fecharEdicaoPerfil()">CANCEL</button>
        </div>
    </div>

    <div id="game-container" style="display: none;">
        <div id="hud" style="display: none;">
            <div id="scoreDisplay">SCORE: 0</div>
            <div id="timerDisplay">TIME: 60</div>
            <div id="healthDisplay">
  <img class="hat-icon" src="imagens_jogo/Stuff/Peppino_hat.gif">
  <img class="hat-icon" src="imagens_jogo/Stuff/Peppino_hat.gif">
  <img class="hat-icon" src="imagens_jogo/Stuff/Peppino_hat.gif">
  <img class="hat-icon" src="imagens_jogo/Stuff/Peppino_hat.gif">
  <img class="hat-icon" src="imagens_jogo/Stuff/Peppino_hat.gif">
  <img class="hat-icon" src="imagens_jogo/Stuff/Peppino_hat.gif">
</div>

        </div>

        <div id="game-area">
            <div id="loading-screen" style="display: none;">
                <h1>Loading...</h1>
                <div class="loader-bar-container">
                    <div id="barra-loading"></div>
                </div>
            </div>

            <div id="start-screen" style="display: none;">
                <button class="btn-start" onclick="irParaModos()">START GAME</button>
            </div>

            <div id="mode-screen" style="display: none;">
                    
                <div class="modos-container">
                    <button class="btn-modo btn-noise" id="btn-noise" onclick="selecionarModo('noise')">NOISE MODE</button>
                    <button class="btn-modo btn-doise" id="btn-doise" onclick="selecionarModo('doise')" disabled>DOISE OVERLAY</button>
                    <button class="btn-modo btn-faker" id="btn-faker" onclick="selecionarModo('faker')" disabled>FAKER ATTACK</button>
                </div>
                <button id="btn-start-battle" onclick="clicarStartBattle()">START BATTLE!</button>
            </div>

            <div id="pause-screen" style="display: none;">
                <h2>PAUSED</h2>
                <div class="botoes-container-pause">
                    <button class="btn-start" onclick="alternarPause()">Back to Battle!</button>
                    <button class="btn-start" onclick="abrirTrocaModoPause()">Change modes</button>
                    <button class="btn-start" onclick="reiniciarPartida()">Restart</button>
                    <button class="btn-start" onclick="voltarParaTitulo()">Go back to Title Screen</button>
                </div>
            </div>

            <div id="change-mode-pause-screen" style="display: none;">
                <h2>SELECT MODE</h2>
                <div id="lista-modos-pause" class="modos-container"></div>
                <button class="btn-start" style="margin-top: 20px;" onclick="fecharTrocaModoPause()">Go back</button>
            </div>

            <div id="plataforma1" class="plataforma-fisica" style="display: none;"></div>
            <div id="plataforma2" class="plataforma-fisica" style="display: none;"></div>
            <div id="tutorial-platform-container"></div>
            <div id="pizza-granny-container"></div>
            <div id="tutorial-dialog" style="display: none;"></div>
            
            <div id="player" style="display: none;">
                <div id="taunt-effect"></div>
                <div id="peppino-sprite"></div>
            </div>
            
            <div id="noise" style="display: none;"></div>   
            <div id="gustavo" style="display: none;"></div>
            <div id="topping-container"></div>
            <div id="result-screen" style="display: none;">
            <div id="result-rank"></div>
            <div id="result-prompt" style="display: none;">Press [Z] to continue!</div>
            </div>


        </div>
    </div>

    <script src="script_geral.js"></script>
</body>
</html>
