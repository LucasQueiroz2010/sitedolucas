<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTWE</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

    <div id="perfil-ptwe" onclick="abrirEstatisticas()">
        <img id="foto-perfil-ptwe" src="imagens_jogo/profile_pictures/generic.png" alt="Perfil">
        <span id="nome-perfil-ptwe">Player</span>
    </div>

    <div id="stats-screen" style="display: none;">
        <h2>ESTATÍSTICAS DO JOGADOR</h2>
        <div id="stats-content" class="stats-box"></div>
        <div class="botoes-container">
            <button class="btn-start" style="font-size: 25px; padding: 10px 20px;" onclick="abrirEdicaoPerfil()">EDITAR PERFIL</button>
            <button class="btn-start" style="font-size: 25px; padding: 10px 20px; background: #ff3333; border-color: #aa0000; color: white; text-shadow: 2px 2px 0px black; box-shadow: 0px 8px 0px #880000;" onclick="apagarDados()">ERASE DATA</button>
            <button class="btn-start" style="font-size: 25px; padding: 10px 20px;" onclick="fecharEstatisticas()">VOLTAR</button>
        </div>
    </div>

    <div id="edit-profile-screen" style="display: none;">
        <h2>EDITAR PERFIL</h2>
        <div class="stats-box" style="display: flex; flex-direction: column; gap: 10px; align-items: center; justify-content: flex-start;">
            <label for="input-novo-nome" style="color: #48a0f8; font-size: 20px;">NOME DE USUÁRIO:</label>
            <input type="text" id="input-novo-nome" style="font-size: 20px; padding: 10px; width: 90%; background: #111; color: white; border: 2px solid #54260d; border-radius: 5px;">
            
            <label style="color: #48a0f8; font-size: 20px; margin-top: 15px;">ESCOLHA SEU AVATAR:</label>
            <div id="grid-avatares"></div>
        </div>
        <div class="botoes-container">
            <button class="btn-start" style="font-size: 25px; padding: 10px 20px;" onclick="salvarEdicaoPerfil()">SALVAR</button>
            <button class="btn-start" style="font-size: 25px; padding: 10px 20px;" onclick="fecharEdicaoPerfil()">CANCELAR</button>
        </div>
    </div>

    <div id="game-container">
        <div id="hud">
            <div id="scoreDisplay">SCORE: 0</div>
            <div id="timerDisplay">TIME: 60</div>
            <div id="healthDisplay">HP: 6</div>
        </div>

        <div id="game-area">
            <div id="loading-screen">
                <h1>Loading...</h1>
                <div class="loader-bar-container">
                    <div id="barra-loading"></div>
                </div>
            </div>

            <div id="start-screen">
                <button class="btn-start" onclick="irParaModos()">START GAME</button>
            </div>

            <div id="mode-screen">
                <div class="modos-container">
                    <button class="btn-modo" id="btn-noise" onclick="selecionarModo('noise')">NOISE MODE</button>
                    <button class="btn-modo" id="btn-doise" onclick="selecionarModo('doise')" disabled>DOISE OVERLAY</button>
                    <button class="btn-modo" id="btn-faker" onclick="selecionarModo('faker')" disabled>FAKER ATTACK</button>
                </div>
                <button id="btn-start-battle" onclick="clicarStartBattle()">START BATTLE!</button>
            </div>

            <div id="player" style="position: absolute; width: 50px; height: 50px; display: none;"></div>
            <div id="noise" style="position: absolute; width: 50px; height: 50px; display: none;"></div>
        </div>
    </div>

    <script src="script_geral.js"></script>
</body>
</html>
