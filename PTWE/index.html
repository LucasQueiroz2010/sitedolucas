<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<link rel="stylesheet" href="estilo.css">
	<link rel="stylesheet" href="normalize.css">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <title>Pizza Tower - Web Edition</title>
    <style>
        :root {
            --game-base-width: 900px;
            --game-base-height: 500px;}
            @font-face {
	font-family: "PzzTwr";
	src: url("PzzTwr.woff");}
        body {
            font-family: PzzTwr;
            background-color: #54260d;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;}
        @keyframes floating {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }}
        .floating-anim {
            animation: floating 3s ease-in-out infinite;}
        .icon-unmute { background-image: url(imagens_jogo/Stuff/unmute_button.png) !important; }
        .icon-mute { background-image: url(imagens_jogo/Stuff/mute_button.png) !important; }
        .icon-fullscreen-enter { background-image: url(imagens_jogo/Stuff/fullscreen_on.png) !important; }
        .icon-fullscreen-exit { background-image: url(imagens_jogo/Stuff/fullscreen_off.png) !important; }
        #top-right-menu {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 1000;}
        .menu-btn {
            background: none;
            border: none;
            cursor: pointer;
            width: 40px;
            height: 40px;
            background-size: contain;
            background-repeat: no-repeat;
            background-color: rgba(0, 0, 0, 0.4);
            border-radius: 5px;
            border: 2px solid transparent;
            transition: transform 0.1s;}
        .menu-btn:hover { border-color: white; transform: scale(1.1); }
        .menu-btn:active { transform: scale(0.95); }
        .icon-restart { background-image: url(imagens_jogo/Stuff/restart_button.png); }
        #main-container {
            position: relative;
            width: 100%;
            max-width: var(--game-base-width);
            aspect-ratio: 9 / 5;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            border: 5px solid black;
            overflow: hidden;
            margin: auto;
            height: auto;
            min-height: 200px;}
        :fullscreen #main-container {
            width: 100vw;
            height: 100vh;
            border-radius: 0;
            max-width: none;
            max-height: none;
            margin: 0;
            border: none;}
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url(imagens_jogo/Stuff/Title_screen.png);
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            z-index: 20;
            color: white;}
        #mode-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url(imagens_jogo/Stuff/Mode\ screen.jpg);
            background-color: #2a2a2a;
            background-size: cover;
            background-position: center;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 25;
            gap: 20px;}
        #loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: white;
            font-size: 2em;
            font-weight: bold;
            text-shadow: 2px 2px 0 #000;}
        #pause-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 90;
            gap: 20px;}
        .pause-title {
            font-size: 3em;
            color: white;
            margin-bottom: 20px;
            text-shadow: 4px 4px 0 #000;}
        .mode-select-btn {
            font-size: 1.8em;
            font-weight: bold;
            padding: 10px 0;
            width: 300px;
            cursor: pointer;
            border-radius: 10px;
            text-align: center;
            border-style: solid;
            border-width: 5px;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.5);
            transition: transform 0.1s;
            font-family: inherit;}
        .mode-select-btn:hover { transform: scale(1.05); }
        .mode-select-btn:active { transform: scale(0.95); }
        #btn-noise-mode { background-color: #f8e080; border-color: #d88818; color: #54260d; }
        #btn-doise-mode { background-color: #2c6ebf; border-color: #d868a0; color: white; }
        #btn-faker-mode { background-color: #b0b0b0; border-color: black; color: black; }
        #game-area {
            width: 100%;
            height: 100%;
            background-color: black;
            background-image: url(imagens_jogo/Stuff/backwoag.png);
            background-size: 100% 100%;
            background-repeat: no-repeat;
            position: relative;
            display: none;}
        #player, #the-noise, .topping, .power-up, #jukebox {
            position: absolute;
            background-size: contain;
            background-repeat: no-repeat;
            z-index: 10;}
        #static-peppino, #static-noise, #static-doise {
            position: absolute;
            background-size: contain;
            background-repeat: no-repeat;
            z-index: 9;}
        #coming-soon {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 3em;
            font-weight: bold;
            color: red;
            text-shadow: 3px 3px 0 white, -1px -1px 0 black;
            z-index: 50;
            display: none;
            font-family: inherit;
            pointer-events: none;}
        .platform {
            position: absolute;
            background-color: #d98918;
            border: 3px solid black;
            border-radius: 5px;
            box-sizing: border-box;
            z-index: 5;}
        .facing-left { transform: scaleX(-1); }
        .rock-entity {
            position: absolute;
            background-size: contain;
            background-repeat: no-repeat;
            z-index: 15;
            background-image: url(imagens_jogo/Stuff/Rock.png);}
        .bomb-entity {
            position: absolute;
            background-size: contain;
            background-repeat: no-repeat;
            z-index: 15;
            background-image: url(imagens_jogo/Stuff/Bomb.gif);}
        .explosion-entity {
            position: absolute;
            background-size: contain;
            background-repeat: no-repeat;
            z-index: 16;
            background-image: url(imagens_jogo/Stuff/Explosion.gif);
            pointer-events: none;}
        .rock-warning, .bomb-warning {
            opacity: 0.8;
            animation: flicker-warning 0.2s infinite;}
        @keyframes flicker-warning {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }}
        .rock-breaking { opacity: 0.7; transition: opacity 0.2s; }

        /* SPRITES */
        .moving-sprite { background-image: url(imagens_jogo/P_sprites/Peppino_walk.gif); }
        .running-sprite { background-image: url(imagens_jogo/P_sprites/Peppino_run.gif); }
        .jumping-sprite { background-image: url(imagens_jogo/P_sprites/Peppino_jump.gif); }
        .wall-slide-sprite { background-image: url(imagens_jogo/P_sprites/Peppino_wall.gif); }
        .peppino-hurt-sprite { background-image: url(imagens_jogo/P_sprites/Peppino_hurt.gif); }
        .peppino-stun-sprite { background-image: url(imagens_jogo/P_sprites/Peppino_fireass.gif); }
        .stomp-mode { background-image: url(imagens_jogo/P_sprites/Peppino_stomp.gif); }
        .peppino-win-sprite { background-image: url(imagens_jogo/P_sprites/Peppino_win.gif); }
        .peppino-lose-sprite { background-image: url(imagens_jogo/P_sprites/Peppino_lose.gif); }
        .invincible { opacity: 0.7; animation: flicker 0.1s infinite alternate; }
        .is-stunned { pointer-events: none; }
        .peppino-tired-sprite { background-image: url(imagens_jogo/Peppino_milk.gif); }
        #the-noise {
            width: 75px;
            height: 100px;
            position: absolute;
            bottom: 0;
            left: 700px;
            background-image: url(imagens_jogo/Noise_walk.gif);
            background-size: contain;
            background-repeat: no-repeat;
            text-indent: -9999px;
            border-radius: 5px;
            z-index: 9;
            transition: opacity 0.1s;}
        .noise-jumping { background-image: url(imagens_jogo/N_sprites/Noise_jump.png); }
        .noise-double-jump { background-image: url(imagens_jogo/N_sprites/Noise_doublejump.gif); }
        .noise-win-sprite { background-image: url(imagens_jogo/N_sprites/Noise_win.gif); }
        .noise-disabled {
            opacity: 0.7;
            transform: translateY(10px);
            background-image: url(imagens_jogo/Noise_hurt.gif);}
        .noise-joke-mode { opacity: 1; pointer-events: none; }
        .noise-happy { background-image: url(imagens_jogo/N_sprites/Noise_happy.gif); }
        .noise-scared { background-image: url(imagens_jogo/N_sprites/Noise_scaried.gif); }
        .noise-powered-up { background-image: url(imagens_jogo/N_sprites/Pepper_Pizza_Noise.gif); }
        .noise-tired-sprite { background-image: url(imagens_jogo/N_sprites/Noise_milk.gif); }
        #gustavo {
            position: absolute;
            width: 60px;
            height: 80px;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            background-size: contain;
            background-repeat: no-repeat;
            z-index: 5;}
        .gustavo-idle-sprite { background-image: url(imagens_jogo/G_sprites/Gustavo_idle.gif); }
        .gustavo-noise-hit-sprite { background-image: url(imagens_jogo/G_sprites/Gustavo_N_hit.gif); }
        .gustavo-drop-sprite { background-image: url(imagens_jogo/G_sprites/Gustavo_drop.gif); }
        .gustavo-peppino-hit-sprite { background-image: url(imagens_jogo/G_sprites/Gustavo_P_hit.gif); }
        .gustavo-pepper-peppino-sprite { background-image: url(imagens_jogo/G_sprites/Gustavo_PP.gif); }
        .gustavo-pepper-noise-sprite { background-image: url(imagens_jogo/G_sprites/Gustavo_PN.gif); }
        .gustavo-win-sprite { background-image: url(imagens_jogo/G_sprites/Gustavo_P_win.gif); }
        .gustavo-lose-sprite { background-image: url(imagens_jogo/G_sprites/Gustavo_N_win.gif); }
        .power-up {
            width: 35px;
            height: 35px;
            position: absolute;
            background-size: contain;
            background-repeat: no-repeat;
            animation: glow 1s infinite alternate;
            z-index: 12;}
        .invincibility-powerup { background-image: url(imagens_jogo/Toppings/Pepper_Pizza.gif); }
        @keyframes flicker {
            from { opacity: 1; }
            to { opacity: 0.7; }}
        @keyframes glow {
            from { box-shadow: 0 0 5px orange, 0 0 10px yellow; }
            to { box-shadow: 0 0 10px orange, 0 0 20px yellow; }}
        .topping {
            width: 25px;
            height: 25px;
            position: absolute;
            background-size: contain;
            background-repeat: no-repeat;
            text-indent: -9999px;
            border-radius: 50%;
            animation: bounce 0.5s infinite alternate;
            z-index: 8;}
        .topping-1 { background-image: url(imagens_jogo/Toppings/Mushroom.gif); }
        .topping-2 { background-image: url(imagens_jogo/Toppings/Cheese.gif); }
        .topping-3 { background-image: url(imagens_jogo/Toppings/Tomato.gif); }
        .topping-4 { background-image: url(imagens_jogo/Toppings/Weiner.gif); }
        .topping-5 { background-image: url(imagens_jogo/Toppings/Pineapple.gif); }
        .topping-gerome { background-image: url(imagens_jogo/Toppings/Gerome.gif); }
        .topping-life { background-image: url(imagens_jogo/Toppings/Life_hat.png); border-radius: 5px; }
        @keyframes bounce {
            from { transform: translateY(0px); }
            to { transform: translateY(-5px); }}
        #ui-bar {
            width: 100%;
            max-width: 900px;
            margin-bottom: 15px;
            display: none;
            justify-content: space-between;
            font-size: 1.5em;
            font-weight: bold;
            color: yellow;}
        #score, #timer, #health {
            background-color: #54260d;
            padding: 5px 15px;
            border: 2px solid black;
            color: white;
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 150px;
            text-align: center;}
        #health {
            min-width: 250px;
            justify-content: space-around;
            flex-direction: row;}
        .health-icon {
            width: 25px;
            height: 25px;
            background-size: contain;
            background-repeat: no-repeat;
            margin-right: 5px;
            display: inline-block;}
        .final-rank-image {
            width: 350px;
            height: 200px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            margin: 20px auto 0;
            background-color: transparent;}
        .rank-P-image { background-image: url(imagens_jogo/Ranks/P-Rank.png); border: 3px solid black; }
        .rank-S-image { background-image: url(imagens_jogo/Ranks/S-Rank.png); border: 3px solid black; }
        .rank-A-image { background-image: url(imagens_jogo/Ranks/A-Rank.png); border: 3px solid black; }
        .rank-B-image { background-image: url(imagens_jogo/Ranks/B-Rank.jpg); border: 3px solid black; }
        .rank-C-image { background-image: url(imagens_jogo/Ranks/C-Rank.png); border: 3px solid black; }
        .rank-D-image { background-image: url(imagens_jogo/Ranks/D-Rank.png); border: 3px solid black; }
        .rank-F-image { background-image: url(imagens_jogo/Ranks/F-Rank.png); border: 3px solid black; }
        .rank-IDK-image { background-image: url(imagens_jogo/Ranks/IDK-Rank.png); border: 3px solid #d0b8b8; }
        .rank-DEAD-image {
            background-image: url(imagens_jogo/Ranks/DEAD_Rank.png);
            border: 5px solid black;
            filter: drop-shadow(0 0 10px #d0b8b8);}
        .message {
            margin-top: 20px;
            font-size: 2em;
            font-weight: bold;
            min-height: 50px;}
        .message2 {
            margin-top: 20px;
            font-size: 2em;
            font-weight: bold;
            color: black;
            min-height: 50px;}
        .depression {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 30px;
            font-size: 2em;
            font-weight: bold;
            cursor: pointer;
            background-color: #f1c40f;
            color: #54260d;
            border: 5px solid black;
            border-radius: 10px;
            box-shadow: 0 8px #d35400;
            transition: transform 0.1s, box-shadow 0.1s;
            z-index: 30;}
        .depression:hover { background-color: #f39c12; }
        .doise-btn {
            background-color: #48a0f9 !important;
            color: white !important;
            left: auto !important;
            transform: none !important;
            margin-top: 0;
            position: absolute;
            right: 20px;
            bottom: 20px;
            border: 4px solid #2c6ebf !important;
            border-bottom-color: #d868a0 !important;
            font-size: 1.1em;
            padding: 8px 15px;
            z-index: 100;}
        .doise-btn:hover {
            background-color: #3b8cd6 !important;
            transform: scale(1.05) !important;}
        .doise-btn:active { transform: translateY(4px) !important; }
    </style>
    <link rel="icon" href="imagens_jogo/Stuff/favicon_jogo.png" type="image/png">
    <link rel="apple-touch-icon" href="imagens_jogo/Stuff/favicon_jogo_apple_touch.png">

<body>   
    <div id="top-right-menu">
        <button id="desktop-fullscreen-button" class="menu-btn icon-fullscreen-enter" onclick="toggleDesktopFullscreen()" title="Modo Tela Cheia"></button>
        <button id="restart-round-button" class="menu-btn icon-restart" onclick="if(document.getElementById('start-screen').style.display === 'none') startGame();" title="Reiniciar Round"></button>
        <button id="mute-button" class="menu-btn icon-unmute" onclick="toggleMute()" title="Ligar/Desligar Áudio"></button>
    </div>
    <h2 class="Pizza_text">Pizza Tower - Web Edition</h2>
    <div style="display:none;">
        <audio id="bgm-audio" loop src="soundtrack_jogo/Background_Music.mp3"></audio>
        <audio id="start-bgm-audio" autoplay loop src="soundtrack_jogo/Start_Music.mp3"></audio>
        <audio id="pepper-peppino-audio" loop src="soundtrack_jogo/Pepper_Pizza_Peppino_Music.mp3"></audio>
        <audio id="pepper-noise-audio" loop src="soundtrack_jogo/Pepper_Pizza_Noise.mp3"></audio>
        <audio id="sfx-audio" src=""></audio>
        <audio id="walk-audio" loop src="soundtrack_jogo/Peppino_step.wav"></audio>
        <audio id="conflict-audio" src="soundtrack_jogo/Parry.wav"></audio>
        <audio id="doise-bgm-audio" loop src="soundtrack_jogo/Doise_Mode_Music.mp3"></audio>
        <audio id="doise-hurt-audio" src="soundtrack_jogo/Doise_hurt.mp3"></audio>
        <audio id="pepper-doise-audio" loop src="soundtrack_jogo/Pepper_Pizza_Doise.mp3"></audio>
        <audio id="pause-audio" loop src="soundtrack_jogo/Pause_Music.mp3"></audio>
        <audio id="faker-bgm-audio" loop src="soundtrack_jogo/Faker_Mode_Music.mp3"></audio>
    </div>
    <div id="ui-bar">
        <div id="score">Score: 0</div>
        <div style="display:flex; flex-direction: column; gap: 5px;">
            <div id="health">Hits: </div>
        </div>
        <div id="timer">Time: 60</div>
    </div>
    <div id="main-container">
        <div id="start-screen" class="text-center">
            <button class="depression" onclick="goToModeSelection();">Start Game!</button>
        </div>
        <div id="mode-screen">
            <button id="btn-noise-mode" class="mode-select-btn" onclick="selectMode('normal')">Noise Mode</button>
            <button id="btn-doise-mode" class="mode-select-btn" onclick="selectMode('doise')">Doise Overlay</button>
            <button id="btn-faker-mode" class="mode-select-btn" onclick="startFakerMode()">Faker Attack</button>
        </div>
        <div id="loading-screen">
            Loading...
        </div>
<div id="pause-screen">
            <div class="pause-title">PAUSED</div>
            <button id="btn-back-battle" class="mode-select-btn" style="background-color: black; border-color: gray; color: white;" onclick="togglePause()">Back to Battle!</button>
            <button id="btn-chance" class="mode-select-btn" onclick="toggleGameMode()">Switch Mode</button>
            <button id="btn-restart" class="mode-select-btn" style="background-color: #ff3333; border-color: #880000; color: white;" onclick="startGame()">Restart Game</button>
            <button class="mode-select-btn" style="background-color: #b0b0b0; border-color: black; color: black;" onclick="window.location.reload()">Title screen</button>
        </div>        
        <div id="game-area">
            <div id="faker-health-container" style="display:none; position:absolute; top:10px; left:10px; z-index:100; background-color:#54260d; padding:5px 15px; border:2px solid black; color:white; border-radius:5px; min-width:250px; justify-content:space-around; flex-direction:row; align-items:center;">Faker: </div>
            <div id="coming-soon">COMING SOON!</div>
            <div id="player"></div>
            <div id="the-noise"></div>
            <div id="gustavo"></div>
            <div id="static-peppino"></div>
            <div id="static-noise"></div>
            <div id="static-doise"></div>
            <div id="jukebox" style="display:none;"></div>
        </div> 
    </div> <div id="status" class="message2"> Controls: Arrows to move, [Z] = Jump, [SHIFT] = Run, [X] = Grab, [C] = Taunt.</div>
    <div id="rank-image-container" class="final-rank-image" style="display:none;"></div>
    <script>
        let isDoiseMode = false;
        let isFakerMode = false;
        let isPaused = false;
        const EASY_SPRITES_CONFIG = {
            restartIcon: "url(imagens_jogo/Stuff/restart_button.png)"};

        // SPRITES DO PEPPINO
        const PLAYER_IDLE_SPRITE = "url(imagens_jogo/P_sprites/Peppino_idle.gif)";
        const PLAYER_WALK_SPRITE = "url(imagens_jogo/P_sprites/Peppino_walk.gif)";
        const PLAYER_RUN_SPRITE = "url(imagens_jogo/P_sprites/Peppino_run.gif)";
        const PLAYER_JUMP_SPRITE = "url(imagens_jogo/P_sprites/Peppino_jump.gif)";
        const PLAYER_WALL_SLIDE_SPRITE = "url(imagens_jogo/P_sprites/Peppino_wall.gif)";
        const PLAYER_WALL_FALL_SPRITE = "url(imagens_jogo/P_sprites/Peppino_wallfall.gif)";
        const PLAYER_HURT_SPRITE = "url(imagens_jogo/P_sprites/Peppino_hurt.gif)";
        const PLAYER_STUN_SPRITE = "url(imagens_jogo/P_sprites/Peppino_fireass.gif)";
        const PEPPINO_PARRY_SPRITE = "url(imagens_jogo/P_sprites/Peppino_parry.gif)";
        const PEPPER_SPRITE = "url(imagens_jogo/P_sprites/Pepper_Pizza_Peppino.gif)";
        const PLAYER_TIRED_SPRITE = "url(imagens_jogo/P_sprites/Peppino_milk.gif)";
        const PEPPINO_WIN_TIME_SPRITE = "url(imagens_jogo/P_sprites/Peppino_win.gif)";
        const PEPPINO_LOSE_NOISE_SPRITE = "url(imagens_jogo/P_sprites/Peppino_lose.gif)";
        const PEPPINO_ROCK_HURT_SPRITE = "url(imagens_jogo/P_sprites/Peppino_stun.gif)";
        const PLAYER_GRAB_SPRITE = "url(imagens_jogo/P_sprites/Peppino_grab.gif)";
        const PLAYER_DANCE_SPRITE = "url(imagens_jogo/P_sprites/Peppino_dance.gif)";
        const PARRY_SPRITES = [
            "url(imagens_jogo/P_sprites/Peppino_parry.png)",
            "url(imagens_jogo/P_sprites/Peppino_parry2.png)",
            "url(imagens_jogo/P_sprites/Peppino_parry3.png)"];
        const TAUNT_SPRITES = [

                for (let key in this.savedTimes) {

            STATIC_DOISE.style.display = 'none';
            COMING_SOON_TEXT.style.display = 'none';

            // VITÓRIA DO NOISE/DOISE/FAKER
            if (health <= 0) {
                STATUS_DISPLAY.textContent = `F-RANK! ${rankData.message} Points: ${score}.`;
                STATUS_DISPLAY.style.color = rankData.color;
                PLAYER.style.backgroundImage = PEPPINO_LOSE_NOISE_SPRITE;
                if(isFakerMode) {
                    playSFX(SOUNDS.WinFaker);
                    NOISE.style.backgroundImage = FAKER_WIN_SPRITE;
                } else if (isDoiseMode) {
                    playSFX(SOUNDS.WinDoise);
                    NOISE.style.backgroundImage = DOISE_WIN_SPRITE;
                } else {
                    playSFX(SOUNDS.WinNoise);
                    NOISE.style.backgroundImage = NOISE_WIN_SPRITE;}
                NOISE.classList.remove('facing-left');
                RANK_IMAGE_CONTAINER.style.display = 'block';
                RANK_IMAGE_CONTAINER.className = `final-rank-image ${rankData.rankClass}`;

            // VITÓRIA DO PEPPINO
            } else if (timeUp || (isFakerMode && fakerHealth <= 0)) {
                playSFX(SOUNDS.WinPeppino);
                STATUS_DISPLAY.textContent = `${rankData.rank}! ${rankData.message} Points: ${score}.`;
                STATUS_DISPLAY.style.color = rankData.color;
                RANK_IMAGE_CONTAINER.style.display = 'block';
                RANK_IMAGE_CONTAINER.className = `final-rank-image ${rankData.rankClass}`;
                PLAYER.style.backgroundImage = PEPPINO_WIN_TIME_SPRITE;
                if(isFakerMode) {
                    NOISE.style.backgroundImage = FAKER_LOSE_SPRITE;
                    setTimeout(() => {
                        if (isGameOver && fakerHealth <= 0) {
                            NOISE.style.display = 'none';}
                    }, 2000); 
                } else if (isDoiseMode) {
                    NOISE.style.backgroundImage = DOISE_LOSE_SPRITE;
                } else {
                    NOISE.style.backgroundImage = NOISE_LOSE_SPRITE;}
                NOISE.classList.remove('facing-left');}
            STATUS_DISPLAY.style.display = 'block';
            GUSTAVO.style.bottom = (SCALED_GROUND_HEIGHT + SCALED_OFFSET_PEPPINO) + 'px';
            updateGustavoSprite();}

        // LÓGICA DO PAUSE
        function togglePause() {
            if (isGameOver || START_SCREEN.style.display !== 'none') return;
            isPaused = !isPaused;
            if (isPaused) {
                PAUSE_SCREEN.style.display = 'flex';
                if (isFakerMode) {
                    BTN_CHANCE.style.display = 'none';
                    document.getElementById('btn-restart').style.display = 'none';
                } else {
                    BTN_CHANCE.style.display = 'block';
                    document.getElementById('btn-restart').style.display = 'block';}
                [BGM_AUDIO, START_BGM_AUDIO, PEPPER_PEPPINO_AUDIO, PEPPER_NOISE_AUDIO, DOISE_BGM, PEPPER_DOISE_AUDIO, FAKER_BGM].forEach(audio => {
                    if (!audio.paused) {
                        audio.pause();
                        audio.dataset.wasPlaying = "true";
                    } else {
                        audio.dataset.wasPlaying = "false";}});
                if (!isMuted) PAUSE_AUDIO.play();
                pauseManager.pauseAll();
                if (isDoiseMode) {
                    BTN_CHANCE.style.backgroundColor = '#2c6ebf';
                    BTN_CHANCE.style.borderColor = '#d868a0';
                    BTN_CHANCE.style.color = 'white';
                } else if (isFakerMode) {
                    BTN_CHANCE.style.backgroundColor = '#b0b0b0';
                    BTN_CHANCE.style.borderColor = '#000';
                    BTN_CHANCE.style.color = '#000';
                } else {
                    BTN_CHANCE.style.backgroundColor = '#f8e080';
                    BTN_CHANCE.style.borderColor = '#d88818';
                    BTN_CHANCE.style.color = '#54260d';}
            } else {
                PAUSE_SCREEN.style.display = 'none';
                PAUSE_AUDIO.pause();
                PAUSE_AUDIO.currentTime = 0;
                [BGM_AUDIO, START_BGM_AUDIO, PEPPER_PEPPINO_AUDIO, PEPPER_NOISE_AUDIO, DOISE_BGM, PEPPER_DOISE_AUDIO, FAKER_BGM].forEach(audio => {
                    if (audio.dataset.wasPlaying === "true" && !isMuted) audio.play();});
                pauseManager.resumeAll();}}

        // CONTROLES DO TECLADO
        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'p') {
                togglePause();
                return;}
            if (isGameOver || isPeppinoStunned || isParrying || isPaused) return;
            keys[key] = true;
            if (key === 'z') {
                playerJump();}
            if (key === 'shift' && currentSpeed === WALK_SPEED) {
                currentSpeed = RUN_SPEED;}
            if (key === 'x' && isFakerMode && !isPlayerGrabbing && canGrab) {
                executePlayerGrab();}
            if (key === 'c' && !isDancing && !isTaunting) {
                startTaunt();}});
        document.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            keys[key] = false;
            if (key === 'shift') {
                currentSpeed = WALK_SPEED;}
            if (key === 'c') {
                if(isDancing) {
                    stopTaunt();
                }
            }});

        // INICIALIZAÇÃO
        function startNormalGame() {
            platformBaseData = [...DEFAULT_PLATFORM_DATA];
            GUSTAVO.style.display = 'block';
            isDoiseMode = false;
            isFakerMode = false;
            currentToppingChance = 1.0;
            currentPepperChance = 0.1;
            currentGustavoChance = 0.5;
            currentSpawnInterval = 1500;
            platformColor = '#f8e080';
            platformBorder = '#d88818';
            WALK_AUDIO.src = "soundtrack_jogo/Peppino_step.wav";
            startGame();}
        function startDoiseMode() {
            platformBaseData = [...DEFAULT_PLATFORM_DATA];
            GUSTAVO.style.display = 'block';
            isDoiseMode = true;
            isFakerMode = false;
            currentToppingChance = 0.8;
            currentPepperChance = 0.075;
            currentGustavoChance = 0.25;
            currentSpawnInterval = 1400;
            platformColor = '#2c6ebf';
            platformBorder = '#d868a0';
            WALK_AUDIO.src = "soundtrack_jogo/Peppino_step.wav";
            startGame();}
        function startFakerGame() {
            platformBaseData = []; 
            GUSTAVO.style.display = 'none';
            STATIC_NOISE.style.display = 'none';
            STATIC_DOISE.style.display = 'none';
            isDoiseMode = false;
            isFakerMode = true;
            currentToppingChance = 0;
            currentPepperChance = 0;
            currentGustavoChance = 0;
            currentSpawnInterval = 0;
            platformColor = '#4a4a4a';
            platformBorder = '#000000';
            WALK_AUDIO.src = "soundtrack_jogo/Peppino_step.wav";
            startGame();}
        function startGame() {
            if (!isGameOver) { endGame(); }
            START_SCREEN.style.display = 'none';
            MODE_SCREEN.style.display = 'none';
            LOADING_SCREEN.style.display = 'none';
            GAME_AREA.style.display = 'block';
            document.getElementById('ui-bar').style.display = 'flex';
            STATUS_DISPLAY.className = 'message';
            STATUS_DISPLAY.style.color = 'white';
            if(isFakerMode) {
                FAKER_HEALTH_CONTAINER.style.display = 'flex';
            } else {
                FAKER_HEALTH_CONTAINER.style.display = 'none';}
            updateScaledConstants();
            score = 0;
            health = MAX_HEALTH;
            fakerHealth = MAX_HEALTH;
            hitsTaken = 0;
            isGameOver = false;
            isPaused = false;
            keys = {};
            currentSpeed = WALK_SPEED;
            isInvincible = false;
            isPowerupInvincible = false;
            noiseIsPoweredUp = false;
            activePowerupElement = null;
            isWallSliding = false;
            isWallFalling = false;
            wallSlideStartTime = 0;
            noiseIsStunned = false;
            noiseIsJoking = false;
            isPeppinoStunned = false;
            isParrying = false;
            isDancing = false;
            isTaunting = false;
            isPlayerGrabbing = false;
            canGrab = true;
            fakerIsDashing = false;
            hideJukebox();
            playerFacingRight = true;
            hasGeromeSpawned = false;
            activeRocks = [];
            activeBombs = [];
            pauseManager.timeouts = {};
            pauseManager.savedTimes = {};
            clearTimeout(playerPowerupTimer);
            clearTimeout(noisePowerupTimer);
            clearTimeout(noiseStunTimer);
            clearTimeout(parryTimer);
            clearTimeout(tauntTimeout);
            clearTimeout(danceTimer);
            clearTimeout(gustavoStateTimer);
            gustavoState = 'idle';
            velocityY = 0;
            noiseVY = 0;
            noiseLastJumpTime = 0;
            PLAYER.classList.remove('invincible', 'stomp-mode', 'facing-left', 'running-sprite', 'moving-sprite', 'peppino-tired-sprite', 'peppino-hurt-sprite', 'peppino-stun-sprite', 'is-stunned', 'wall-slide-sprite', 'peppino-parry-sprite');
            PLAYER.style.backgroundImage = PLAYER_IDLE_SPRITE;
            NOISE.style.display = 'block';
            NOISE.classList.remove('noise-disabled', 'facing-left', 'noise-jumping', 'noise-double-jump', 'noise-happy', 'noise-scared', 'noise-powered-up', 'noise-idle-sprite', 'noise-tired-sprite', 'noise-joke-mode', 'is-stunned', 'invincible');
            NOISE.style.backgroundImage = isFakerMode ? FAKER_IDLE_SPRITE : NOISE_WALK_SPRITE;
            updateGustavoSprite();
            RANK_IMAGE_CONTAINER.style.display = 'none';
            clearInterval(timerInterval);
            clearInterval(gameLoopInterval);
            clearInterval(spawnInterval);
            clearInterval(rockSpawnInterval);
            clearInterval(bombSpawnInterval);
            document.querySelectorAll('.topping, .power-up, .rock-entity, .bomb-entity, .explosion-entity').forEach(t => t.remove());
            SCORE_DISPLAY.textContent = 'Score: 0';
            updateHealthDisplay();
            updateFakerHealthDisplay();
            STATUS_DISPLAY.textContent = 'Use the platforms to get the Toppings!';
            STATUS_DISPLAY.className = 'message';
            STATUS_DISPLAY.style.color = 'white';
            STATUS_DISPLAY.style.display = 'block';
            if (isDoiseMode) {
                time = 90;
                playBGM(DOISE_BGM);
                currentNoiseSpeed = NOISE_SPEED * 1.2;
                GAME_AREA.style.backgroundImage = DOISE_BACKGROUND;
                playerX = getScaledValue(GAME_WIDTH - PLAYER_WIDTH - 50 - SCALED_WALL_MARGIN);
                noiseX = getScaledValue(50 + SCALED_WALL_MARGIN);
                rockSpawnInterval = setInterval(() => {
                    if (isDoiseMode && !isGameOver && !isPaused && Math.random() < 0.20) {
                        spawnRock();}
                }, 1000);
                bombSpawnInterval = setInterval(() => {
                    if (isDoiseMode && !isGameOver && !isPaused && Math.random() < 0.05) {
                        spawnBomb();}
                }, 800);
                NOISE.style.display = 'block';
                STATIC_PEPPINO.style.display = 'none';
                STATIC_NOISE.style.display = 'none';
                STATIC_DOISE.style.display = 'none';
                startTimer();
                spawnInterval = setInterval(spawnTopping, currentSpawnInterval);
            } else if (isFakerMode) {
                time = 60;
                playBGM(FAKER_BGM);
                GAME_AREA.style.backgroundImage = FAKER_BACKGROUND;
                playerX = (GAME_WIDTH / 2) - (PLAYER_WIDTH / 2);
                noiseX = getScaledValue(50 + SCALED_WALL_MARGIN);
                NOISE.style.display = 'block';
                STATIC_PEPPINO.style.display = 'none';
                COMING_SOON_TEXT.style.display = 'none';
                STATUS_DISPLAY.textContent = 'Survive the FAKER ATTACK!';
                startTimer();
            } else {
                time = 60;
                playBGM(BGM_AUDIO);
                currentNoiseSpeed = NOISE_SPEED;
                GAME_AREA.style.backgroundImage = NORMAL_BACKGROUND;
                playerX = getScaledValue(BASE_PLAYER_START_X + BASE_WALL_MARGIN);
                noiseX = getScaledValue(BASE_NOISE_START_X_POS - BASE_WALL_MARGIN);
                NOISE.style.display = 'block';
                STATIC_PEPPINO.style.display = 'none';
                STATIC_NOISE.style.display = 'none';
                STATIC_DOISE.style.display = 'none';
                startTimer();
                spawnInterval = setInterval(spawnTopping, currentSpawnInterval);
                for (let i = 0; i < 3; i++) {
                    const topping = document.createElement('div');
                    const randomToppingClass = TOPPING_CLASSES[Math.floor(Math.random() * TOPPING_CLASSES.length)];
                    topping.classList.add('topping', randomToppingClass);
                    const { x, y } = getRandomSpawnPosition();
                    topping.style.left = x + 'px';
                    topping.style.bottom = y + 'px';
                    topping.style.width = TOPPING_SIZE + 'px';
                    topping.style.height = TOPPING_SIZE + 'px';
                    GAME_AREA.appendChild(topping);}}
            TIMER_DISPLAY.textContent = `Time: ${time}`;
            playerY = SCALED_GROUND_HEIGHT;
            noiseY = SCALED_GROUND_HEIGHT;
            PLAYER.style.left = playerX + 'px';
            PLAYER.style.bottom = (playerY + SCALED_OFFSET_PEPPINO) + 'px'; 
            NOISE.style.left = noiseX + 'px';
            NOISE.style.bottom = (noiseY + (isFakerMode ? SCALED_OFFSET_FAKER : SCALED_OFFSET_NOISE)) + 'px'; 
            createPlatforms();
            updateItemsPosition();
            gameLoopInterval = setInterval(gameLoop, 1000 / 60);}
        window.onload = () => {
            updateScaledConstants();
            isGameOver = true;
            updateHealthDisplay();
            playBGM(START_BGM_AUDIO);            
            const unlockAudio = () => {
                if(START_BGM_AUDIO.paused && !isMuted) {
                    playBGM(START_BGM_AUDIO);}
                document.removeEventListener('click', unlockAudio);
                document.removeEventListener('keydown', unlockAudio);};
            document.addEventListener('click', unlockAudio);
            document.addEventListener('keydown', unlockAudio);
            MUTE_BUTTON.classList.add('icon-unmute');};
    </script>
</body>
</html>
